<html>

  <style>
  * {
    box-sizing: border-box;
  }
  body {
    display: grid;
	margin: 0px;
	padding: 0px;
	gap: 5px;
	grid-template-areas:
	  "navi main1"
	  "navi main2"
	  "navi main3";
  }
  div {
    border-color: black;
	border-radius: 3px;
	border-style: solid;
	border-width: 1px;
	margin: 0px;
  }
  .main-body {
	margin: 5px 5px 5px 0px;
	height: 100vh;
  }
  .navi {
	background-color: gray;
	grid-area: navi;
  }
  .main {
    background-color: #FFFF00;
  }
  .main.a {
    background-color: red;
	grid-area: main1;
  }
  .main.b {
    background-color: green;
	grid-area: main2;
  }
  .main.c {
    background-color: blue;
	grid-area: main3;
  }
  </style>
</head>
<body>

  <div id="test1" class="navi"></div>
  <div class="main-body">
    <div id="test2" class="main a">1</div>
    <div id="test3" class="main b"></div>
