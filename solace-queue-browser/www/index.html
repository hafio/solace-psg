<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solace Queue Browser</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.prod.js"></script>
    <script src="js/solclient.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <style>
        .message-container {
            max-height: 600px;
            overflow-y: auto;
        }
        .connection-status {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .status-connected { background-color: #28a745; }
        .status-disconnected { background-color: #dc3545; }
        .status-connecting { background-color: #ffc107; }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div id="app" class="container-fluid">
        <!-- Loading Overlay -->
        <div class="loading-overlay" v-if="loading">
            <div class="spinner-border text-light" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Header -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <i class="bi bi-envelope"></i> Solace Queue Browser
                </a>
                <div class="d-flex align-items-center text-white">
                    <span class="connection-status" :class="connectionStatusClass"></span>
                    {{ connectionStatus }}
                </div>
            </div>
        </nav>

        <!-- Connection Form -->
        <div class="row mb-4" v-if="!isConnected">
            <div class="col-md-6 offset-md-3">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Connect to Solace</h5>
                    </div>
                    <div class="card-body">
                        <form @submit.prevent="connect">
                            <div class="mb-3">
                                <label class="form-label">Broker URL</label>
                                <input type="text" class="form-control" v-model="config.url" required
                                    placeholder="ws://localhost:8008 or wss://broker.example.com:443">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Message VPN</label>
                                <input type="text" class="form-control" v-model="config.vpn" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-control" v-model="config.username" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" v-model="config.password" required>
                            </div>
                            <button type="submit" class="btn btn-primary" :disabled="connecting">
                                <span v-if="connecting" class="spinner-border spinner-border-sm me-1"></span>
                                {{ connecting ? 'Connecting...' : 'Connect' }}
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Queue Browser -->
        <div v-if="isConnected" class="row">
            <!-- Queue List -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">Queues</h5>
                        <button class="btn btn-sm btn-outline-primary" @click="refreshQueues">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" v-model="queueFilter" placeholder="Filter queues...">
                        </div>
                        <div class="list-group">
                            <a href="#" class="list-group-item list-group-item-action"
                                v-for="queue in filteredQueues"
                                :key="queue.name"
                                :class="{ active: selectedQueue === queue.name }"
                                @click.prevent="selectQueue(queue.name)">
                                {{ queue.name }}
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Message List -->
            <div class="col-md-9">
                <div class="card">
                    <div class="card-header">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="card-title mb-0">Messages: {{ selectedQueue }}</h5>
                            <div class="btn-group">
                                <button class="btn btn-sm btn-outline-primary" @click="refreshMessages" :disabled="!selectedQueue">
                                    <i class="bi bi-arrow-clockwise"></i> Refresh
                                </button>
                                <button class="btn btn-sm btn-outline-success" @click="exportMessages" :disabled="messages.length === 0">
                                    <i class="bi bi-download"></i> Export
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body message-container">
                        <div v-if="!selectedQueue" class="text-center text-muted">
                            Select a queue to view messages
                        </div>
                        <div v-else-if="messages.length === 0" class="text-center text-muted">
                            No messages in queue
                        </div>
                        <div v-else class="accordion" id="messageAccordion">
                            <div class="accordion-item" v-for="(msg, index) in messages" :key="index">
                                <h2 class="accordion-header">
                                    <button class="accordion-button collapsed" type="button" 
                                            :data-bs-target="'#message-' + index" 
                                            data-bs-toggle="collapse">
                                        <div class="d-flex w-100 justify-content-between align-items-center">
                                            <span class="me-3">Message #{{ index + 1 }}</span>
                                            <small class="text-muted">{{ formatDate(msg.timeStamp) }}</small>
                                        </div>
                                    </button>
                                </h2>
                                <div :id="'message-' + index" class="accordion-collapse collapse" 
                                     data-bs-parent="#messageAccordion">
                                    <div class="accordion-body">
                                        <div class="mb-3">
                                            <h6>Headers</h6>
                                            <pre>{{ JSON.stringify(msg.headers, null, 2) }}</pre>
                                        </div>
                                        <div>
                                            <h6>Payload</h6>
                                            <pre>{{ formatPayload(msg.payload) }}</pre>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
